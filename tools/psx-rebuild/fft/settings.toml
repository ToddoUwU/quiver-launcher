# psxrecomp user settings for the rebuilt FFT (framework 09ba00ed).
[video]
vsync = "on"
renderer = "opengl"
window_width = 2560
fast_boot = false
bios_hle = false
fullscreen = 2
frame_interpolation = true
frame_interpolation_fps = 0
aspect_ratio = "4:3"

[audio]
volume = 100
frequency = 44100

[launcher]
skip_launcher = true

[disc]
path = "$HOME/.local/share/QuiverLauncher/Apps/FinalFantasyTactics-FinalFantasyTacticsRecompiled/disc/Final Fantasy Tactics (USA).cue"
selected = 1

[memcard]
dir = "$HOME/.local/share/QuiverLauncher/Apps/FinalFantasyTactics-FinalFantasyTacticsRecompiled/saves"
card1 = "$HOME/.local/share/QuiverLauncher/Apps/FinalFantasyTactics-FinalFantasyTacticsRecompiled/saves/card1.mcd"
card2 = "$HOME/.local/share/QuiverLauncher/Apps/FinalFantasyTactics-FinalFantasyTacticsRecompiled/saves/card2.mcd"
enable1 = true
enable2 = true

[controller]
p1_device = "auto"
p1_mode = "digital"
p1_deadzone = 3276
multitap = true
multitap_analog = false

[localization]
language = "en"
