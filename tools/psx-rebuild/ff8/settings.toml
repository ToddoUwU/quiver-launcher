# psxrecomp user settings for the rebuilt FF8 (framework 09ba00ed).
[video]
vsync = "on"
renderer = "opengl"
window_width = 2560
fast_boot = false
bios_hle = false
fullscreen = 2
frame_interpolation = true
frame_interpolation_fps = 0
aspect_ratio = "4:3"

[audio]
volume = 100
frequency = 44100

[launcher]
skip_launcher = true

[bios]
path = "$HOME/QuiverLauncher/src/ff-newfw/ff8/psxrecomp/bios/SCPH1001.BIN"

[disc]
path = "$HOME/.local/share/QuiverLauncher/Apps/FinalFantasyVIII-FinalFantasyVIIIRecompiled/disc/Final Fantasy VIII (USA) (Disc 1).cue"
selected = 1

[memcard]
dir = "$HOME/QuiverLauncher/src/ff-newfw/ff8-testsaves"
card1 = "$HOME/QuiverLauncher/src/ff-newfw/ff8-testsaves/card1.mcd"
card2 = "$HOME/QuiverLauncher/src/ff-newfw/ff8-testsaves/card2.mcd"
enable1 = true
enable2 = true

[controller]
p1_device = "auto"
p1_mode = "digital"
p1_deadzone = 3276
multitap = false

[localization]
language = "en"
